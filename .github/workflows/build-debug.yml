name: Build Debug APK

on:
  push:
    branches: [ nuvio-ui ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "build-debug-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-debug-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nuvio-ui-latest
          name: "CloudStream Nuvio UI (Latest Debug Build)"
          body: |
            Automated debug APK build from branch `nuvio-ui` with Nuvio Mobile UI styling.
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
